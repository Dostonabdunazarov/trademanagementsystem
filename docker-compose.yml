services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: tradems
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  tradems-api:
    build:
      context: ./TradeMS
      dockerfile: TradeMS.Api/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=tradems;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: TradeMS
      Jwt__Audience: TradeMS
      # Короткий access-токен: смена роли/деактивация вступает в силу не позже чем через 15 минут.
      Jwt__ExpiryMinutes: "15"
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo -e \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\" > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  tradems-ui:
    build:
      context: ./trade-ms-ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Порт 80 наружу не публикуется — им владеет Caddy (/root/corpdev/infra).
    # Caddy проксирует savdo.hypex.site -> tradems-ui:80 по сети proxy.
    networks:
      - default
      - proxy
    depends_on:
      tradems-api:
        condition: service_healthy

networks:
  proxy:
    external: true

volumes:
  postgres_data:
