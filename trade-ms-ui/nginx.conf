# Заголовки безопасности. add_header наследуется в location только если там нет
# своих add_header, поэтому весь набор повторяется в каждом location с Cache-Control.
#
# CSP соответствует тому, что реально грузит приложение:
#   - скрипты и стили — только свои файлы из /assets (Vite);
#   - style-src 'unsafe-inline' — Radix (react-remove-scroll) и sonner вставляют <style> в рантайме;
#   - Google Fonts: CSS с fonts.googleapis.com, файлы шрифтов с fonts.gstatic.com (index.html);
#   - connect-src: API на том же origin (/api) и курсы ЦБ https://cbu.uz (CurrencyRateTicker);
#   - img-src data: — inline SVG/иконки в CSS.
map $host $csp_policy {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://cbu.uz; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy $csp_policy always;

    # Прокси-заголовки не менять: бэкенд берёт реальный IP клиента из цепочки
    # Caddy → nginx (ForwardedHeaders), от этого зависит rate limiting по IP.
    location /api/ {
        proxy_pass http://tradems-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Собранные файлы с хэшем в имени — неизменяемы, кэшируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy $csp_policy always;
        try_files $uri =404;
    }

    # favicon версионируется через ?v= в index.html.
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy $csp_policy always;
    }

    # index.html не кэшируем, иначе после деплоя браузер держит ссылки на старые файлы.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy $csp_policy always;
        try_files $uri $uri/ /index.html;
    }
}
