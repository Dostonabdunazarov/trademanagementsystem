server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://tradems-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Собранные файлы с хэшем в имени — неизменяемы, кэшируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # favicon версионируется через ?v= в index.html.
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400";
    }

    # index.html не кэшируем, иначе после деплоя браузер держит ссылки на старые файлы.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
